name: Cut Release on Merge to Master
on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    name: Tag and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version tag
        id: version
        run: |
          today=$(date -u +%Y.%m.%d)
          base="v${today}"
          if ! git rev-parse -q --verify "refs/tags/${base}" >/dev/null; then
            tag="$base"
          else
            n=1
            while git rev-parse -q --verify "refs/tags/${base}.${n}" >/dev/null; do
              n=$((n + 1))
            done
            tag="${base}.${n}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          notes="${PR_BODY}"
          if [ -z "$notes" ]; then
            notes="Merged #${PR_NUMBER}: ${PR_TITLE}"
          fi
          gh release create "$TAG" \
            --target master \
            --title "$PR_TITLE" \
            --notes "$notes"
