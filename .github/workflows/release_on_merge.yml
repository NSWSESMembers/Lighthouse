name: Cut Release on Merge to Master
on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    name: Tag and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      # Skip the release for PRs labelled `no-release`, or whose changes are all
      # under .github/ (workflows, dependabot config) - repo automation only.
      - name: Decide whether to release
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HAS_NO_RELEASE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-release') }}
        run: |
          if [ "$HAS_NO_RELEASE_LABEL" = "true" ]; then
            echo "PR #${PR_NUMBER} is labelled no-release; skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '^\.github/'; then
            echo "PR #${PR_NUMBER} only changes .github/; skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version tag
        if: steps.gate.outputs.release == 'true'
        id: version
        run: |
          today=$(date -u +%Y.%m.%d)
          base="v${today}"
          if ! git rev-parse -q --verify "refs/tags/${base}" >/dev/null; then
            tag="$base"
          else
            n=1
            while git rev-parse -q --verify "refs/tags/${base}.${n}" >/dev/null; do
              n=$((n + 1))
            done
            tag="${base}.${n}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create and publish release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          notes="${PR_BODY}"
          if [ -z "$notes" ]; then
            notes="Merged #${PR_NUMBER}: ${PR_TITLE}"
          fi
          gh release create "$TAG" \
            --target master \
            --title "$PR_TITLE" \
            --notes "$notes"

      - name: Trigger Chrome Store publish
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish_prod.yml --ref master
