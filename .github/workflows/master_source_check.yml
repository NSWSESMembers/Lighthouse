name: Master PR source check
# PRs into master must come from this repo's master-dev branch. Make the
# "Source is master-dev" job a required check on master (ruleset) to enforce it;
# admins can bypass the ruleset for a genuine hotfix.
#
# Dependabot security PRs always target master (GitHub ignores target-branch for
# them). They get the no-release label so merging one doesn't cut a release.
#
# pull_request_target so the check always runs the copy of this file on master,
# not one a PR could edit. It never checks out or runs PR code - keep it that way.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches: [master]

permissions: {}

jobs:
  label-dependabot:
    name: Label Dependabot no-release
    if: github.event.pull_request.user.login == 'dependabot[bot]' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add no-release label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label no-release

  source:
    name: Source is master-dev
    runs-on: ubuntu-latest
    steps:
      - name: Check head branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && [ "$HEAD_REF" = "master-dev" ]; then
            echo "PR comes from ${HEAD_REPO}:${HEAD_REF}."
            exit 0
          fi
          echo "::error::PRs into master must come from ${GITHUB_REPOSITORY}:master-dev, not ${HEAD_REPO}:${HEAD_REF}. Retarget this PR to master-dev."
          exit 1
