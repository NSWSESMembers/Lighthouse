name: Linter
on:
  pull_request:
jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install modules
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run dev