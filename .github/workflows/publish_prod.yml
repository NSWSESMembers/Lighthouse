name: Publish Prod to Chrome Store
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lintandpublish:
    name: Publish Prod
    runs-on: ubuntu-latest
    # Web Store secrets live in this environment: master only, admin approval.
    environment: chrome-web-store
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install modules
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build Package
        run: npm run prod
      - name: Chrome extension upload action
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: build/*.zip
          extension-id: ${{ secrets.CHROMESTORE_PROD_ID }}
          publisher-id: ${{ secrets.CHROMESTORE_PUB_ID }}
          client-id: ${{ secrets.CHROMESTORE_CLIENT_ID }}
          client-secret: ${{ secrets.CHROMESTORE_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROMESTORE_REFRESH_TOKEN }}
          publish: true
          glob: true
