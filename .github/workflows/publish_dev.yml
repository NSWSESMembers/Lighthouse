name: Publish Dev Preview to Chrome Store
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lintandpublish:
    name: Publish Dev
    runs-on: ubuntu-latest
    # Web Store secrets live in this environment: master-dev only, admin approval.
    environment: chrome-web-store-dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install modules
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build package
        run: npm run dev
      - name: Chrome extension upload action
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: build/*.zip
          extension-id: ${{ secrets.CHROMESTORE_DEV_ID }}
          publisher-id: ${{ secrets.CHROMESTORE_PUB_ID }}
          client-id: ${{ secrets.CHROMESTORE_CLIENT_ID }}
          client-secret: ${{ secrets.CHROMESTORE_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROMESTORE_REFRESH_TOKEN }}
          publish: true
          glob: true
